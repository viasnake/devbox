name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: '2026.9.12'
      - run: mise tasks validate
      - run: mise run --dry-run setup
      - run: mise run up --help
      - run: mise run ssh --help
      - run: mise run halt --help
      - run: uv run --locked python -m unittest discover -s tests -v
      - run: uv run --locked python -m py_compile devbox.py tests/test_devbox.py
      - run: git diff --check
