[tools]
uv = "0.13.1"

[tasks.up]
description = "Start a persistent Ubuntu VM and wait for SSH"
raw_args = true
run = "uv run --locked devbox.py up"

[tasks.ssh]
description = "Connect to an environment with OpenSSH"
raw = true
raw_args = true
run = "uv run --locked devbox.py ssh"

[tasks.halt]
description = "Shut down an environment and wait for QEMU to exit"
raw_args = true
run = "uv run --locked devbox.py halt"

[tasks.setup]
description = "Install QEMU and prepare the locked Python environment"
run = [{ task = "setup-qemu" }, "uv sync --locked"]

[tasks.setup-qemu]
hide = true
shell = "{% if os() == 'windows' %}powershell -NoProfile -Command{% else %}sh -e -c{% endif %}"
run = '''
if [ "$(uname -s)" != "Darwin" ]; then
    echo "QEMU setup supports Windows and macOS only." >&2
    exit 1
fi
HOMEBREW_NO_INSTALL_UPGRADE=1 brew install qemu
'''
run_windows = '''
$ErrorActionPreference = 'Stop'
winget install --id SoftwareFreedomConservancy.QEMU --exact --source winget --no-upgrade
# WinGet reports an existing package as 0x8A150061, even with --no-upgrade.
if ($LASTEXITCODE -eq -1978335135) { exit 0 }
exit $LASTEXITCODE
'''
